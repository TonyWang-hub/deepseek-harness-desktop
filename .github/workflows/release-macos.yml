name: Release macOS

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    environment: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up native Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.17.0'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify tag and native architecture
        id: release
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(node -p 'process.arch')" = "${{ matrix.arch }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install exact dependencies
        run: npm ci --no-audit --fund=false
      - name: Run source tests
        run: npm test
      - name: Stage App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/dsh-notary-api-key.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$key_path"
          test -s "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and run packaged acceptance
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run "dist:mac:${{ matrix.arch }}"
      - name: Remove staged notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/dsh-notary-api-key.p8"
      - name: Verify distribution containers and mounted application
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          artifact="dist/$ARCH/DeepSeek-Harness-Desktop-$VERSION-mac-$ARCH"
          hdiutil verify "$artifact.dmg"
          unzip -tq "$artifact.zip"

          mount_dir=$(mktemp -d "$RUNNER_TEMP/dsh-desktop-dmg.XXXXXX")
          smoke_root=$(mktemp -d "$RUNNER_TEMP/dsh-desktop-smoke.XXXXXX")
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rm -rf -- "$mount_dir" "$smoke_root"
          }
          trap cleanup EXIT

          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$artifact.dmg" >/dev/null
          app="$mount_dir/DeepSeek Harness Desktop.app"
          executable="$app/Contents/MacOS/DeepSeek Harness Desktop"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          smoke_output=$(env DSH_HOME="$smoke_root/dsh" "$executable" \
            --smoke "--user-data-dir=$smoke_root/electron")
          printf '%s\n' "$smoke_output"
          url=$(printf '%s\n' "$smoke_output" | sed -n 's/^SMOKE OK \(http:\/\/127\.0\.0\.1:[0-9][0-9]*\)$/\1/p')
          test -n "$url"
          if curl --silent --fail --max-time 2 "$url" >/dev/null; then
            echo "Host still listens after mounted-app smoke: $url" >&2
            exit 1
          fi
          if pgrep -f "$mount_dir" >/dev/null; then
            echo "Mounted application left a process running" >&2
            exit 1
          fi
      - name: Upload architecture artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch }}/DeepSeek-Harness-Desktop-${{ steps.release.outputs.version }}-mac-${{ matrix.arch }}.dmg
            dist/${{ matrix.arch }}/DeepSeek-Harness-Desktop-${{ steps.release.outputs.version }}-mac-${{ matrix.arch }}.dmg.blockmap
            dist/${{ matrix.arch }}/DeepSeek-Harness-Desktop-${{ steps.release.outputs.version }}-mac-${{ matrix.arch }}.zip
            dist/${{ matrix.arch }}/DeepSeek-Harness-Desktop-${{ steps.release.outputs.version }}-mac-${{ matrix.arch }}.zip.blockmap
            dist/${{ matrix.arch }}/latest-mac.yml
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.17.0'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Download arm64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mac-arm64
          path: dist/arm64
      - name: Download x64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mac-x64
          path: dist/x64
      - name: Install merge dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Verify release version
        id: release
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Merge update metadata
        run: npm run merge:mac:update
      - name: Prepare exact release inventory
        id: assets
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release-assets"
          install -d "$release_dir"
          for arch in arm64 x64; do
            base="DeepSeek-Harness-Desktop-$VERSION-mac-$arch"
            cp "dist/$arch/$base.dmg" "$release_dir/"
            cp "dist/$arch/$base.dmg.blockmap" "$release_dir/"
            cp "dist/$arch/$base.zip" "$release_dir/"
            cp "dist/$arch/$base.zip.blockmap" "$release_dir/"
          done
          cp dist/latest-mac.yml "$release_dir/"
          node build/verify-release-assets.js prepare "$release_dir" "$VERSION"
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
      - name: Upload verified draft and publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ steps.assets.outputs.release_dir }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          release_state="$RUNNER_TEMP/release-state.json"
          if gh release view "$tag" --json isDraft > "$release_state" 2>/dev/null; then
            if test "$(jq -r '.isDraft' "$release_state")" != true; then
              echo "Refusing to replace an already published release: $tag" >&2
              exit 1
            fi
          else
            gh release create "$tag" --draft --verify-tag \
              --title "DeepSeek Harness Desktop $VERSION" --generate-notes
          fi
          gh release upload "$tag" "$RELEASE_DIR"/* --clobber

          downloaded=$(mktemp -d "$RUNNER_TEMP/release-download.XXXXXX")
          gh release download "$tag" --dir "$downloaded"
          node build/verify-release-assets.js verify "$downloaded" "$VERSION"
          gh release edit "$tag" --draft=false --latest
