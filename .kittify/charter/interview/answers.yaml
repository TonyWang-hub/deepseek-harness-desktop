schema_version: "1.0.0"
mission: software-dev
profile: comprehensive
answers:
  project_intent: >-
    Build and independently release the most capable DeepSeek Harness desktop
    client, with macOS first and Windows and Linux following. The product must
    preserve the official DSH Web experience, first-party capabilities, and
    third-party client plugins while adding native desktop lifecycle, security,
    packaging, updates, and system integration. It must consume upstream as a
    versioned dependency rather than fork or patch it, so upstream upgrades are
    normally an automated version bump plus small adapter changes.
  languages_frameworks: >-
    Use TypeScript and Node.js for the shared payload, compatibility adapter,
    supervisor, tests, and tooling. Evaluate Tauri 2 with Rust against an
    Electron reference shell using the exact same official renderer and standard
    Node sidecar. The selected production shell must be decided by measured
    parity, whole-process-tree memory, responsiveness, and startup results rather
    than framework reputation. Keep packages ESM-first and cross-platform.
  testing_requirements: >-
    Test-driven development is required. Start each observable behavior with a
    failing acceptance, contract, integration, or unit test at the narrowest
    stable entry point. Use deterministic fixtures for DSH boot, stream, RPC,
    reconnect, upgrade, and plugin behavior; exercise packaged applications and
    real process boundaries for release-critical flows. Changed executable
    source must have complete branch coverage unless a documented platform-only
    path is covered in its platform CI job.
  quality_gates: >-
    Type checking, linting, formatting, focused tests, dependency and license
    audits, packaging smoke tests, and compatibility checks must pass before
    merge. A release candidate must load every first-party Web contribution and
    at least one out-of-tree dynamic client plugin without modification, expose
    no unauthenticated TCP listener, recover from renderer and Host failure, and
    preserve sessions and settings across an atomic upgrade. No patch-package or
    vendored edits to upstream DSH are permitted.
  review_policy: >-
    Changes land through focused pull requests from codex/* or feat/* branches to
    main using conventional commits. At least one independent review is required
    for production changes; security, updater, signing, IPC, process lifecycle,
    and compatibility changes require an explicit threat or failure-mode review.
    Generated mission status artifacts are not hand-edited.
  performance_targets: >-
    Memory is the highest-priority performance dimension, followed by long-session
    and streaming responsiveness, then startup. Measure every attributable shell,
    WebView, GPU, network, Host, and descendant process on a declared reference Mac
    with identical payloads and fixtures, using de-duplicated physical footprint as
    the decision metric and per-process RSS only for diagnosis.
    During sustained streams, input-to-next-paint must be at most 50 ms at p95 and
    below 100 ms at p99, with no main-loop stall of 250 ms or longer. Warm launch
    must have an operational, Host-connected prompt ready within 1.5 seconds at p95
    and cold launch within 3 seconds at p95. Desktop-owned transport buffers and
    retained shell state must stay bounded relative to the official browser baseline;
    destroying a renderer must reclaim the retired renderer and proxy state, while
    session-level retention remains upstream-owned. Tauri becomes the production
    shell only if all hard gates pass, its predeclared aggregate p95 attributable
    footprint is at least 25 percent lower than Electron, no individual memory
    scenario is more than 5 percent worse, and responsiveness or startup neither
    misses an absolute budget nor regresses by more than 10 percent.
  deployment_constraints: >-
    Ship macOS arm64 first as a signed, hardened, notarized direct-download
    application, then macOS x64 and signed Windows packages, with Linux after the
    platform WebView and packaging matrix passes. Do not target the Mac App Store
    initially because arbitrary workspaces, subprocesses, terminals, and dynamic
    plugins are core capabilities. Bundle an exact supported Node runtime and an
    exact DSH release; update the shell, runtime, adapter, and DSH payload
    atomically. Update signatures are mandatory and rollback or recovery must not
    corrupt the user's DSH home.
  documentation_policy: >-
    Keep architecture decisions, the upstream compatibility matrix, security
    model, performance methodology and results, release procedure, contributor
    setup, and user-facing limitations current in the same pull request as the
    behavior they describe. Specifications explain outcomes; implementation plans
    own technology choices; generated evidence links back to stable requirement
    identifiers.
  risk_boundaries: >-
    Never commit, log, transmit, or bundle user credentials or session contents in
    diagnostics. The renderer is sandboxed and receives only a narrow, versioned,
    capability-based bridge; arbitrary navigation, shell command construction,
    and unrestricted filesystem access are forbidden. The DSH Host runs in a
    standard Node sidecar for native-addon compatibility and must be terminated by
    exact process identity, never a broad process-name kill. Production data paths
    use private inherited IPC or an equivalently authenticated local transport and
    must not expose an unauthenticated loopback service. Unknown upstream versions
    fail with an actionable compatibility error instead of silently degrading.
  amendment_process: >-
    Amend governance through a dedicated pull request that states the changed
    rule, motivation, migration impact, and affected gates. Performance threshold
    changes require new benchmark evidence; security or parity relaxations require
    explicit owner approval and an expiry or restoration plan.
  exception_policy: >-
    Exceptions must be narrow, time-bounded, linked to a tracked issue, identify
    the responsible owner, preserve all unaffected gates, and include a removal
    criterion. No exception may permit credential exposure, unsigned updates,
    unauthenticated production listeners, silent loss of DSH capability, or
    destructive handling of user data.
