openapi: 3.1.0
info:
  title: DSH Desktop Private Control API
  version: 1.0.0
  description: >-
    Shell-only readiness endpoint carried over the authenticated private local
    socket. Product resources and DSH API/RPC routes are transparently
    dispatched by the WebServer-compatible carrier and are intentionally not
    redefined here.
servers:
  - url: http://localhost
    description: Logical HTTP authority over an application-owned Unix-domain socket
    x-transport: unix-domain-socket
security:
  - DesktopToken: []
paths:
  /__dsh_desktop/v1/health:
    get:
      operationId: getDesktopHealth
      summary: Read the current Host generation readiness
      responses:
        "200":
          description: The desktop carrier is alive; state identifies whether the full profile settled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopHealth"
        "401":
          description: The desktop token is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The carrier is alive but the Host generation cannot become ready.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    DesktopToken:
      type: apiKey
      in: header
      name: X-DSH-Desktop-Token
      description: Per-generation 256-bit capability injected by shell-native code and never exposed to renderer JavaScript.
  schemas:
    DesktopHealth:
      type: object
      additionalProperties: false
      required:
        - protocolVersion
        - state
        - applicationInstanceId
        - generation
        - pid
        - processStartUnixMs
        - dshVersion
        - nodeVersion
        - payloadDigest
        - profileDigest
        - overlayDigest
      properties:
        protocolVersion:
          type: integer
          const: 1
        state:
          type: string
          enum:
            - booting
            - ready
            - stopping
        applicationInstanceId:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 1
        pid:
          type: integer
          minimum: 1
        processStartUnixMs:
          type: integer
          minimum: 0
        dshVersion:
          type: string
          minLength: 1
        nodeVersion:
          type: string
          pattern: "^v?[0-9]+\\.[0-9]+\\.[0-9]+"
        payloadDigest:
          $ref: "#/components/schemas/Sha256"
        profileDigest:
          $ref: "#/components/schemas/Sha256"
        overlayDigest:
          $ref: "#/components/schemas/Sha256"
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]+$"
        generation:
          type: integer
          minimum: 1
    Sha256:
      type: string
      pattern: "^[a-f0-9]{64}$"
